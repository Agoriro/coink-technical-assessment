name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  backend:
    name: Backend (.NET + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore COINK.slnx

      - name: Verify formatting
        run: dotnet format COINK.slnx --no-restore --verify-no-changes

      - name: Build solution
        run: dotnet build COINK.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/Coink.UnitTests/Coink.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults/unit

      - name: Run real-PostgreSQL integration tests
        run: >-
          dotnet test tests/Coink.IntegrationTests/Coink.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults/integration

      - name: Upload backend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run strict type checking
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build production application
        run: npm run build

  e2e:
    name: Docker Compose + Playwright E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      E2E_API_BASE_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Verify E2E TypeScript
        run: npm run typecheck
        working-directory: tests/e2e

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps
        working-directory: tests/e2e

      - name: Generate disposable database credential
        run: |
          stack_password="$(openssl rand -hex 32)"
          echo "::add-mask::$stack_password"
          echo "POSTGRES_PASSWORD=$stack_password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start complete stack
        run: docker compose up --build --detach --wait

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests/e2e

      - name: Show Compose diagnostics
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop complete stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
